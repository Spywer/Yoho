x-architecture:
  framework:
    name: Next.js
    version: "15+"
    features: [App Router, RSC, Suspense Streaming, Turbopack, Partial Prerendering]
  auth:
    library: better-auth
    methods: [email, twitch, kick, google]
    session_type: cookie
    cookie_name: yoho_session
  rendering:
    homepage: "SSR + edge cache (HIT, 5 min)"
    search_page: "CSR shell + client-side fetch to /api/search"
    content_pages: "SSR per-request (BYPASS) + RSC streaming"
    warmup: "Client-side prefetch via /api/warm/cards"
  pwa:
    service_worker: true
    manifest: /manifest.json
    theme: dark

x-caching-strategy:
  edge_cached:
    description: Публичные страницы кешируются на edge
    ttl_seconds: 300
    header: "x-cache-status: HIT"
    routes: ["/", "/movie", "/tv", "/anime", "/getlucky", "/marathon", "/franchises", "/movie/genre/*", "/collections/*", "/calendar"]
  bypass:
    description: Персонализированные страницы per-request
    header: "x-cache-status: BYPASS"
    cache_control: "private, no-cache, no-store, max-age=0, must-revalidate"
    routes: ["/search", "/film/{id}", "/series/{id}", "/name/{id}", "/{username}/*", "/api/*"]
  client_cached:
    description: Эндпоинты с коротким клиентским кешем
    routes:
      - path: "/api/player-tags/posters"
        ttl: 60
        scope: private
      - path: "/api/tv-last-air/batch"
        ttl: 300
        swr: 3600
        scope: public

